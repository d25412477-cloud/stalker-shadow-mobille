
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.T.A.L.K.E.R. Mobile</title>
<style>
body {
  margin: 0;
  background: #171b16;
  color: white;
  font-family: Arial;
  overflow: hidden;
}
#game {
  height: 100vh;
  background: linear-gradient(#64745a, #263323);
  position: relative;
}
#title {
  text-align: center;
  padding: 20px;
  color: #d8d2a0;
}
#world {
  position: absolute;
  top: 30%;
  left: 10%;
  right: 10%;
  height: 40%;
  background: #303b2b;
  border: 2px solid #59634a;
  display: flex;
  align-items: center;
  justify-content: center;
}
#player {
  font-size: 70px;
}
#info {
  position: absolute;
  bottom: 150px;
  left: 20px;
  background: #0009;
  padding: 12px;
}
#controls {
  position: absolute;
  bottom: 20px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}
button {
  background: #414b36;
  color: white;
  border: 2px solid #87916b;
  border-radius: 12px;
  padding: 18px;
  font-size: 18px;
}
</style>
</head>
<body>
<div id="game">
  <h2 id="title">S.T.A.L.K.E.R. MOBILE</h2>
  <div id="world">
    <div id="player">☢️</div>
  </div>
  <div id="info">
    Локация: Кордон<br>
    Здоровье: <span id="hp">100</span><br>
    Патроны: <span id="ammo">30</span><br>
    <span id="message">Добро пожаловать в Зону!</span>
  </div>
  <div id="controls">
    <button onclick="move(-1)">◀</button>
    <button onclick="move(1)">▶</button>
    <button onclick="shoot()">🔫 Огонь</button>
  </div>
</div>
<script>
let position = 0;
let ammo = 30;

function move(direction) {
  position += direction;
  document.getElementById("player").style.transform =
    "translateX(" + position * 30 + "px)";
  document.getElementById("message").textContent =
    "Ты исследуешь Кордон...";
}

function shoot() {
  if (ammo > 0) {
    ammo--;
    document.getElementById("ammo").textContent = ammo;
    document.getElementById("message").textContent =
      "Выстрел! Патронов осталось: " + ammo;
  } else {
    document.getElementById("message").textContent =
      "Нет патронов!";
  }
}
</script>
</body>
</html>
